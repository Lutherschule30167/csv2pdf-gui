name: Windows-EXE bauen

# Baut die EXEs beim Veroeffentlichen eines Releases und haengt sie an das
# Release an. Zusaetzlich manuell unter "Actions" startbar; dann liegen die
# EXEs nur als Workflow-Artefakt zum Download bereit.
# Vorabversionen zum Testen kommen vom Branch alpha: __version__ dort z.B.
# auf "0.3.0-alpha.1" setzen, Tag v0.3.0-alpha.1 mit Target alpha anlegen
# und "Set as a pre-release" anhaken.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Vorabversionen (Tag mit Bindestrich, z.B. v0.3.0-alpha.1 vom Branch
      # alpha) muessen als Pre-Release markiert sein. Sonst gilt die Alpha als
      # "neueste Version" und die Download-Links auf Homepage und README
      # (releases/latest) liefern sie an alle aus.
      - name: Vorabversion als Pre-Release markieren
        if: github.event_name == 'release' && contains(github.event.release.tag_name, '-') && !github.event.release.prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "::warning::$TAG ist eine Vorabversion, wurde aber nicht als Pre-Release veroeffentlicht. Wird jetzt nachgeholt."
          gh release edit "$TAG" --repo "${{ github.repository }}" --prerelease --latest=false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller Pillow

      - name: Version pruefen
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import starmoney_export as m; print(m.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version im Code: $VERSION"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            # v0.2 und v0.2.0 passen beide zu __version__ = "0.2"
            if [ "${TAG#v}" != "$VERSION" ] && [ "${TAG#v}" != "$VERSION.0" ]; then
              # Abbrechen statt nur warnen: sonst haengt eine EXE mit falscher
              # Versionsnummer am Release (z.B. Tag auf einem Commit vor dem
              # Versionssprung).
              echo "::error::Release-Tag $TAG passt nicht zu __version__ = $VERSION in starmoney_export.py. Tag auf den richtigen Commit setzen und Release neu anlegen."
              exit 1
            fi
          fi

      - name: EXEs bauen
        run: |
          python make_version_info.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --icon csv2pdf.ico --version-file version_info.txt --add-data "csv2pdf.ico;." --name csv2pdf-gui starmoney_gui.py
          python -m PyInstaller --noconfirm --clean --onefile --console --icon csv2pdf.ico --version-file version_info.txt --name csv2pdf starmoney_export.py

      - name: Kurztest der Kommandozeilen-EXE
        run: dist\csv2pdf.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: csv2pdf-gui-${{ steps.version.outputs.version }}-windows
          path: dist/*.exe

      - name: An Release anhaengen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/csv2pdf-gui.exe dist/csv2pdf.exe --clobber

name: Tests

# Läuft bei jedem Push und Pull Request (u. a. nach alpha und main), damit
# Fehler in der Kernlogik vor dem Release auffallen.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt pytest
      - name: Tests ausführen
        run: python -m pytest -q

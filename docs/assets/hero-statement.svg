<svg viewBox="0 0 560 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Aus einer StarMoney-CSV wird ein formatierter PDF-Kontoauszug</title>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1c2333" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- back sheet: raw CSV, peeking out top-left, slightly rotated -->
  <g transform="translate(18,34) rotate(-6 40 40)" filter="url(#softShadow)">
    <rect x="0" y="0" width="360" height="470" fill="#F4F0E6" stroke="#C9BFA1" stroke-width="1.5"/>
    <text x="24" y="40" font-family="Consolas, 'SFMono-Regular', monospace" font-size="13" fill="#8C3B34">export_2024.csv</text>
    <g font-family="Consolas, 'SFMono-Regular', monospace" font-size="10.5" fill="#5b5748">
      <text x="24" y="70">03.01;Miete Turnhalle;-450,00;2310,55</text>
      <text x="24" y="88">03.01;Foerderverein e.V.;120,00;2430,55</text>
      <text x="24" y="106">04.01;Lastschrift GEZ;-55,00;2375,55</text>
      <text x="24" y="124">04.01;Kopierkosten;-18,40;2357,15</text>
      <text x="24" y="142">05.01;Spende Klasse 4b;75,00;2432,15</text>
      <text x="24" y="160">06.01;Buchhandlung Meyer;-32,90;2399,25</text>
      <text x="24" y="178">06.01;Elternbeitrag Feb.;60,00;2459,25</text>
      <text x="24" y="196">07.01;Überweisung Stadt;300,00;2759,25</text>
      <text x="24" y="214">08.01;Portokosten;-6,50;2752,75</text>
      <text x="24" y="232">09.01;Materialkosten Kunst;-41,00;2711,75</text>
    </g>
    <g stroke="#D8CFB2" stroke-width="1">
      <line x1="24" y1="250" x2="336" y2="250"/>
      <line x1="24" y1="270" x2="300" y2="270"/>
      <line x1="24" y1="290" x2="330" y2="290"/>
      <line x1="24" y1="310" x2="280" y2="310"/>
    </g>
  </g>

  <!-- transformation arrow -->
  <g transform="translate(150,300)">
    <path d="M0,0 C40,-10 60,30 100,20" stroke="#2F5D45" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M92,8 L102,20 L88,26" stroke="#2F5D45" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- front sheet: finished PDF statement -->
  <g transform="translate(150,80)" filter="url(#softShadow)">
    <rect x="0" y="0" width="380" height="500" fill="#FBFAF6" stroke="#1C2333" stroke-width="1.5"/>

    <!-- header band -->
    <rect x="0" y="0" width="380" height="86" fill="#1C2333"/>
    <rect x="24" y="20" width="46" height="46" fill="#FBFAF6" opacity="0.92"/>
    <path d="M35 55 L47 34 L58 48 L64 30" stroke="#2F5D45" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#FBFAF6">Kontoauszug</text>
    <text x="86" y="60" font-family="Consolas, 'SFMono-Regular', monospace" font-size="11" fill="#C9CFC9">Foerderkonto 4021 · Januar 2026</text>

    <!-- ledger rows -->
    <g font-family="Consolas, 'SFMono-Regular', monospace" font-size="11.5">
      <text x="24" y="118" fill="#5b5f66">03.01.</text>
      <text x="86" y="118" fill="#1C2333">Foerderverein e.V.</text>
      <text x="356" y="118" text-anchor="end" fill="#2F5D45">+120,00</text>

      <text x="24" y="142" fill="#5b5f66">03.01.</text>
      <text x="86" y="142" fill="#1C2333">Miete Turnhalle</text>
      <text x="356" y="142" text-anchor="end" fill="#8C3B34">-450,00</text>

      <text x="24" y="166" fill="#5b5f66">05.01.</text>
      <text x="86" y="166" fill="#1C2333">Spende Klasse 4b</text>
      <text x="356" y="166" text-anchor="end" fill="#2F5D45">+75,00</text>

      <text x="24" y="190" fill="#5b5f66">06.01.</text>
      <text x="86" y="190" fill="#1C2333">Elternbeitrag Feb.</text>
      <text x="356" y="190" text-anchor="end" fill="#2F5D45">+60,00</text>

      <text x="24" y="214" fill="#5b5f66">06.01.</text>
      <text x="86" y="214" fill="#1C2333">Buchhandlung Meyer</text>
      <text x="356" y="214" text-anchor="end" fill="#8C3B34">-32,90</text>

      <text x="24" y="238" fill="#5b5f66">08.01.</text>
      <text x="86" y="238" fill="#1C2333">Portokosten</text>
      <text x="356" y="238" text-anchor="end" fill="#8C3B34">-6,50</text>
    </g>
    <g stroke="#E4E0D4" stroke-width="1">
      <line x1="24" y1="128" x2="356" y2="128"/>
      <line x1="24" y1="152" x2="356" y2="152"/>
      <line x1="24" y1="176" x2="356" y2="176"/>
      <line x1="24" y1="200" x2="356" y2="200"/>
      <line x1="24" y1="224" x2="356" y2="224"/>
    </g>

    <!-- footer with links -->
    <line x1="24" y1="440" x2="356" y2="440" stroke="#D8D2BF" stroke-width="1"/>
    <text x="24" y="462" font-family="Consolas, 'SFMono-Regular', monospace" font-size="10" fill="#8a8060">Weiterfuehrende Dokumente</text>
    <text x="24" y="480" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#2F5D45" text-decoration="underline">Beleg f&#252;r Barauslagen</text>
    <text x="180" y="480" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#2F5D45" text-decoration="underline">Kontakt</text>
  </g>
</svg>
